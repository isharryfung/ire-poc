<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IRE Phase 1.1 Demo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='css/app.css') }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">IRE Demo</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/identities/new">Submit Identity</a>
          <a class="nav-link" href="/identities/batch">Batch Upload</a>
          <a class="nav-link" href="/golden-records">Golden Records</a>
          <a class="nav-link" href="/reviews">Reviews</a>
          <a class="nav-link" href="/docs">API Docs</a>
        </div>
      </div>
    </nav>
    <main class="container pb-5">
      <div class="alert alert-warning" role="alert">
        Demo only: no production authentication is implemented. Bind to localhost only and do not expose this app publicly.
      </div>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
